<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1450" viewBox="0 0 1600 1450"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7b8c97"/></marker></defs><rect width="1600" height="1450" fill="#f8f7f3"/><text x="65" y="65" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#102e43" text-anchor="start">pocket ✳</text><text x="65" y="128" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#102e43" text-anchor="start">From purchase intent to payment</text><text x="65" y="173" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#526778" text-anchor="start">Budget approval and PayPal confirmation are separate steps.</text><rect x="65" y="230" width="420" height="125" rx="18" fill="#fff" stroke="#d4dcdf" stroke-width="2"/><text x="90" y="270" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#102e43" text-anchor="start">1  Select a product</text><text x="90" y="308" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#526778" text-anchor="start">Server controls the catalog price</text><polyline points="275,355 275,405" fill="none" stroke="#7b8c97" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="65" y="405" width="420" height="160" rx="18" fill="#fff" stroke="#d4dcdf" stroke-width="2"/><text x="90" y="445" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#102e43" text-anchor="start">2  Classify with OpenAI</text><text x="90" y="483" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#526778" text-anchor="start">Category, confidence and reasoning</text><text x="90" y="514" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#526778" text-anchor="start">Uncertain results need parent review</text><polyline points="275,565 275,615" fill="none" stroke="#7b8c97" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="65" y="615" width="420" height="195" rx="18" fill="#e8eff4" stroke="#d4dcdf" stroke-width="2"/><text x="90" y="655" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#102e43" text-anchor="start">3  Check spending rules</text><text x="90" y="693" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#526778" text-anchor="start">Allowance, category limits and freeze</text><text x="90" y="724" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#526778" text-anchor="start">Approval threshold and Soft Decline</text><text x="90" y="755" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#526778" text-anchor="start">No payment sent; no funds reserved</text><polyline points="485,670 640,670" fill="none" stroke="#7b8c97" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="520" y="650" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#526778" text-anchor="start">Eligible</text><rect x="640" y="585" width="430" height="165" rx="18" fill="#e8eff4" stroke="#d4dcdf" stroke-width="2"/><text x="665" y="625" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#102e43" text-anchor="start">4  Choose Pay with PayPal</text><text x="665" y="663" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#526778" text-anchor="start">Recheck rules under a family lock</text><text x="665" y="694" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#526778" text-anchor="start">Reserve the current budget allocation</text><polyline points="1070,670 1160,670" fill="none" stroke="#7b8c97" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1160" y="585" width="375" height="165" rx="18" fill="#e4eee7" stroke="#d4dcdf" stroke-width="2"/><text x="1185" y="625" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#102e43" text-anchor="start">5  PayPal Sandbox</text><text x="1185" y="663" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#526778" text-anchor="start">Create and capture an order</text><text x="1185" y="694" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#526778" text-anchor="start">Use parent-authorized vault token</text><polyline points="1347,750 1347,855" fill="none" stroke="#7b8c97" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1160" y="855" width="375" height="165" rx="18" fill="#e4eee7" stroke="#d4dcdf" stroke-width="2"/><text x="1185" y="895" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#102e43" text-anchor="start">6  Verify the capture</text><text x="1185" y="933" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#526778" text-anchor="start">Retrieve the order independently</text><text x="1185" y="964" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#526778" text-anchor="start">Check status, amount and currency</text><polyline points="1160,935 1070,935" fill="none" stroke="#7b8c97" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1077" y="908" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#526778" text-anchor="start">Confirmed</text><rect x="640" y="855" width="430" height="165" rx="18" fill="#fff" stroke="#d4dcdf" stroke-width="2"/><text x="665" y="895" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#102e43" text-anchor="start">7  Save receipt and spending</text><text x="665" y="933" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#526778" text-anchor="start">Order and capture references</text><text x="665" y="964" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#526778" text-anchor="start">Parent and teen activity updated</text><polyline points="275,810 275,900" fill="none" stroke="#7b8c97" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="295" y="858" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#526778" text-anchor="start">Review required</text><rect x="65" y="900" width="420" height="160" rx="18" fill="#fff" stroke="#d4dcdf" stroke-width="2"/><text x="90" y="940" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#102e43" text-anchor="start">Parent review</text><text x="90" y="978" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#526778" text-anchor="start">Approve an eligible exception</text><text x="90" y="1009" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#526778" text-anchor="start">or decline without payment</text><polyline points="485,980 550,980 550,715 640,715" fill="none" stroke="#7b8c97" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="560" y="850" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#526778" text-anchor="start">Approved</text><rect x="65" y="1140" width="420" height="150" rx="18" fill="#fff" stroke="#d4dcdf" stroke-width="2"/><text x="90" y="1180" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#102e43" text-anchor="start">Blocked by a hard limit</text><text x="90" y="1218" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#526778" text-anchor="start">Frozen or insufficient total budget</text><text x="90" y="1249" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#526778" text-anchor="start">No PayPal payment request</text><polyline points="65,710 35,710 35,1210 65,1210" fill="none" stroke="#7b8c97" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1160" y="1140" width="375" height="150" rx="18" fill="#fff" stroke="#d4dcdf" stroke-width="2"/><text x="1185" y="1180" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#102e43" text-anchor="start">Uncertain payment outcome</text><text x="1185" y="1218" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#526778" text-anchor="start">Keep the budget reserved</text><text x="1185" y="1249" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#526778" text-anchor="start">Parent checks payment status</text><polyline points="1347,1020 1347,1140" fill="none" stroke="#7b8c97" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="640" y="1150" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#526778" text-anchor="start">GUARDRAILS</text><text x="640" y="1193" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#102e43" text-anchor="start">AI cannot authorize payments.</text><text x="640" y="1234" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#526778" text-anchor="start">Stable request IDs protect retries.</text><text x="640" y="1271" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#526778" text-anchor="start">Parent approval cannot bypass</text><text x="640" y="1306" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#526778" text-anchor="start">a freeze or the total allowance.</text><text x="65" y="1400" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#526778" text-anchor="start">All payments use PayPal Sandbox. No real money or goods are exchanged.</text></svg>